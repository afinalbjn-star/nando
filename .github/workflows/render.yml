name: Render CrystalShards (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render CrystalShards (ProRes)
        run: npx remotion render src/index.tsx CrystalShards output/CrystalShards-prores.mov --codec prores --prores-profile hq

      - name: Render ShardGold (ProRes)
        run: npx remotion render src/index.tsx ShardGold output/ShardGold-prores.mov --codec prores --prores-profile hq

      - name: Render ShardIce (ProRes)
        run: npx remotion render src/index.tsx ShardIce output/ShardIce-prores.mov --codec prores --prores-profile hq

      - name: Render ShardRose (ProRes)
        run: npx remotion render src/index.tsx ShardRose output/ShardRose-prores.mov --codec prores --prores-profile hq

      - name: Render ShardEmerald (ProRes)
        run: npx remotion render src/index.tsx ShardEmerald output/ShardEmerald-prores.mov --codec prores --prores-profile hq

      - name: Encode CrystalShards to MP4
        run: ffmpeg -i output/CrystalShards-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/CrystalShards.mp4

      - name: Encode ShardGold to MP4
        run: ffmpeg -i output/ShardGold-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/ShardGold.mp4

      - name: Encode ShardIce to MP4
        run: ffmpeg -i output/ShardIce-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/ShardIce.mp4

      - name: Encode ShardRose to MP4
        run: ffmpeg -i output/ShardRose-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/ShardRose.mp4

      - name: Encode ShardEmerald to MP4
        run: ffmpeg -i output/ShardEmerald-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/ShardEmerald.mp4

      - name: Upload CrystalShards
        uses: actions/upload-artifact@v4
        with:
          name: CrystalShards
          path: output/CrystalShards.mp4

      - name: Upload ShardGold
        uses: actions/upload-artifact@v4
        with:
          name: ShardGold
          path: output/ShardGold.mp4

      - name: Upload ShardIce
        uses: actions/upload-artifact@v4
        with:
          name: ShardIce
          path: output/ShardIce.mp4

      - name: Upload ShardRose
        uses: actions/upload-artifact@v4
        with:
          name: ShardRose
          path: output/ShardRose.mp4

      - name: Upload ShardEmerald
        uses: actions/upload-artifact@v4
        with:
          name: ShardEmerald
          path: output/ShardEmerald.mp4
