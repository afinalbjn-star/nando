name: Render Fan Compositions (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render VioletFan (ProRes)
        run: npx remotion render src/index.tsx VioletFan output/VioletFan-prores.mov --codec prores --prores-profile hq

      - name: Render FanCrimson (ProRes)
        run: npx remotion render src/index.tsx FanCrimson output/FanCrimson-prores.mov --codec prores --prores-profile hq

      - name: Render FanOcean (ProRes)
        run: npx remotion render src/index.tsx FanOcean output/FanOcean-prores.mov --codec prores --prores-profile hq

      - name: Render FanEmerald (ProRes)
        run: npx remotion render src/index.tsx FanEmerald output/FanEmerald-prores.mov --codec prores --prores-profile hq

      - name: Render FanAmber (ProRes)
        run: npx remotion render src/index.tsx FanAmber output/FanAmber-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode VioletFan to MP4
        run: ffmpeg -y -i output/VioletFan-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/VioletFan.mp4

      - name: Encode FanCrimson to MP4
        run: ffmpeg -y -i output/FanCrimson-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/FanCrimson.mp4

      - name: Encode FanOcean to MP4
        run: ffmpeg -y -i output/FanOcean-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/FanOcean.mp4

      - name: Encode FanEmerald to MP4
        run: ffmpeg -y -i output/FanEmerald-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/FanEmerald.mp4

      - name: Encode FanAmber to MP4
        run: ffmpeg -y -i output/FanAmber-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/FanAmber.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload VioletFan
        uses: actions/upload-artifact@v4
        with:
          name: VioletFan-4K
          path: output/VioletFan.mp4

      - name: Upload FanCrimson
        uses: actions/upload-artifact@v4
        with:
          name: FanCrimson-4K
          path: output/FanCrimson.mp4

      - name: Upload FanOcean
        uses: actions/upload-artifact@v4
        with:
          name: FanOcean-4K
          path: output/FanOcean.mp4

      - name: Upload FanEmerald
        uses: actions/upload-artifact@v4
        with:
          name: FanEmerald-4K
          path: output/FanEmerald.mp4

      - name: Upload FanAmber
        uses: actions/upload-artifact@v4
        with:
          name: FanAmber-4K
          path: output/FanAmber.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: Fan-ProRes
          path: |
            output/VioletFan-prores.mov
            output/FanCrimson-prores.mov
            output/FanOcean-prores.mov
            output/FanEmerald-prores.mov
            output/FanAmber-prores.mov
