name: Render PastelPoly (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render PastelPoly (ProRes)
        run: npx remotion render src/index.tsx PastelPoly output/PastelPoly-prores.mov --codec prores --prores-profile hq

      - name: Render PolyMint (ProRes)
        run: npx remotion render src/index.tsx PolyMint output/PolyMint-prores.mov --codec prores --prores-profile hq

      - name: Render PolySunset (ProRes)
        run: npx remotion render src/index.tsx PolySunset output/PolySunset-prores.mov --codec prores --prores-profile hq

      - name: Render PolyOcean (ProRes)
        run: npx remotion render src/index.tsx PolyOcean output/PolyOcean-prores.mov --codec prores --prores-profile hq

      - name: Render PolyGrape (ProRes)
        run: npx remotion render src/index.tsx PolyGrape output/PolyGrape-prores.mov --codec prores --prores-profile hq

      - name: Encode PastelPoly to MP4
        run: ffmpeg -i output/PastelPoly-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/PastelPoly.mp4

      - name: Encode PolyMint to MP4
        run: ffmpeg -i output/PolyMint-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/PolyMint.mp4

      - name: Encode PolySunset to MP4
        run: ffmpeg -i output/PolySunset-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/PolySunset.mp4

      - name: Encode PolyOcean to MP4
        run: ffmpeg -i output/PolyOcean-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/PolyOcean.mp4

      - name: Encode PolyGrape to MP4
        run: ffmpeg -i output/PolyGrape-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/PolyGrape.mp4

      - name: Upload PastelPoly
        uses: actions/upload-artifact@v4
        with:
          name: PastelPoly
          path: output/PastelPoly.mp4

      - name: Upload PolyMint
        uses: actions/upload-artifact@v4
        with:
          name: PolyMint
          path: output/PolyMint.mp4

      - name: Upload PolySunset
        uses: actions/upload-artifact@v4
        with:
          name: PolySunset
          path: output/PolySunset.mp4

      - name: Upload PolyOcean
        uses: actions/upload-artifact@v4
        with:
          name: PolyOcean
          path: output/PolyOcean.mp4

      - name: Upload PolyGrape
        uses: actions/upload-artifact@v4
        with:
          name: PolyGrape
          path: output/PolyGrape.mp4
