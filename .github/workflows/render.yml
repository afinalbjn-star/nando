name: Render Pastel Compositions (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render PastelPeach (ProRes)
        run: npx remotion render src/index.tsx PastelPeach output/PastelPeach-prores.mov --codec prores --prores-profile hq

      - name: Render PastelLavender (ProRes)
        run: npx remotion render src/index.tsx PastelLavender output/PastelLavender-prores.mov --codec prores --prores-profile hq

      - name: Render PastelMint (ProRes)
        run: npx remotion render src/index.tsx PastelMint output/PastelMint-prores.mov --codec prores --prores-profile hq

      - name: Render PastelSky (ProRes)
        run: npx remotion render src/index.tsx PastelSky output/PastelSky-prores.mov --codec prores --prores-profile hq

      - name: Render PastelRose (ProRes)
        run: npx remotion render src/index.tsx PastelRose output/PastelRose-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode PastelPeach to MP4
        run: ffmpeg -y -i output/PastelPeach-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/PastelPeach.mp4

      - name: Encode PastelLavender to MP4
        run: ffmpeg -y -i output/PastelLavender-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/PastelLavender.mp4

      - name: Encode PastelMint to MP4
        run: ffmpeg -y -i output/PastelMint-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/PastelMint.mp4

      - name: Encode PastelSky to MP4
        run: ffmpeg -y -i output/PastelSky-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/PastelSky.mp4

      - name: Encode PastelRose to MP4
        run: ffmpeg -y -i output/PastelRose-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/PastelRose.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload PastelPeach
        uses: actions/upload-artifact@v4
        with:
          name: PastelPeach-4K
          path: output/PastelPeach.mp4

      - name: Upload PastelLavender
        uses: actions/upload-artifact@v4
        with:
          name: PastelLavender-4K
          path: output/PastelLavender.mp4

      - name: Upload PastelMint
        uses: actions/upload-artifact@v4
        with:
          name: PastelMint-4K
          path: output/PastelMint.mp4

      - name: Upload PastelSky
        uses: actions/upload-artifact@v4
        with:
          name: PastelSky-4K
          path: output/PastelSky.mp4

      - name: Upload PastelRose
        uses: actions/upload-artifact@v4
        with:
          name: PastelRose-4K
          path: output/PastelRose.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: Pastel-ProRes
          path: |
            output/PastelPeach-prores.mov
            output/PastelLavender-prores.mov
            output/PastelMint-prores.mov
            output/PastelSky-prores.mov
            output/PastelRose-prores.mov
