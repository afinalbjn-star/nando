name: Render Facet Compositions (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render FacetedMosaic (ProRes)
        run: npx remotion render src/index.tsx FacetedMosaic output/FacetedMosaic-prores.mov --codec prores --prores-profile hq

      - name: Render GoldFacet (ProRes)
        run: npx remotion render src/index.tsx GoldFacet output/GoldFacet-prores.mov --codec prores --prores-profile hq

      - name: Render RoseFacet (ProRes)
        run: npx remotion render src/index.tsx RoseFacet output/RoseFacet-prores.mov --codec prores --prores-profile hq

      - name: Render EmeraldFacet (ProRes)
        run: npx remotion render src/index.tsx EmeraldFacet output/EmeraldFacet-prores.mov --codec prores --prores-profile hq

      - name: Render VioletFacet (ProRes)
        run: npx remotion render src/index.tsx VioletFacet output/VioletFacet-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode FacetedMosaic to MP4
        run: ffmpeg -y -i output/FacetedMosaic-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/FacetedMosaic.mp4

      - name: Encode GoldFacet to MP4
        run: ffmpeg -y -i output/GoldFacet-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/GoldFacet.mp4

      - name: Encode RoseFacet to MP4
        run: ffmpeg -y -i output/RoseFacet-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/RoseFacet.mp4

      - name: Encode EmeraldFacet to MP4
        run: ffmpeg -y -i output/EmeraldFacet-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/EmeraldFacet.mp4

      - name: Encode VioletFacet to MP4
        run: ffmpeg -y -i output/VioletFacet-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/VioletFacet.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload FacetedMosaic
        uses: actions/upload-artifact@v4
        with:
          name: FacetedMosaic-4K
          path: output/FacetedMosaic.mp4

      - name: Upload GoldFacet
        uses: actions/upload-artifact@v4
        with:
          name: GoldFacet-4K
          path: output/GoldFacet.mp4

      - name: Upload RoseFacet
        uses: actions/upload-artifact@v4
        with:
          name: RoseFacet-4K
          path: output/RoseFacet.mp4

      - name: Upload EmeraldFacet
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldFacet-4K
          path: output/EmeraldFacet.mp4

      - name: Upload VioletFacet
        uses: actions/upload-artifact@v4
        with:
          name: VioletFacet-4K
          path: output/VioletFacet.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: Facet-ProRes
          path: |
            output/FacetedMosaic-prores.mov
            output/GoldFacet-prores.mov
            output/RoseFacet-prores.mov
            output/EmeraldFacet-prores.mov
            output/VioletFacet-prores.mov
