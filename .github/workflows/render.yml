name: Render Globe (5 compositions)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render Globe (ProRes)
        run: npx remotion render src/index.tsx Globe output/Globe-prores.mov --codec prores --prores-profile hq

      - name: Render GlobeArcs (ProRes)
        run: npx remotion render src/index.tsx GlobeArcs output/GlobeArcs-prores.mov --codec prores --prores-profile hq

      - name: Render GlobeNight (ProRes)
        run: npx remotion render src/index.tsx GlobeNight output/GlobeNight-prores.mov --codec prores --prores-profile hq

      - name: Render GlobeHolo (ProRes)
        run: npx remotion render src/index.tsx GlobeHolo output/GlobeHolo-prores.mov --codec prores --prores-profile hq

      - name: Render GlobeOrbit (ProRes)
        run: npx remotion render src/index.tsx GlobeOrbit output/GlobeOrbit-prores.mov --codec prores --prores-profile hq

      - name: Encode Globe to MP4
        run: ffmpeg -i output/Globe-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/Globe.mp4

      - name: Encode GlobeArcs to MP4
        run: ffmpeg -i output/GlobeArcs-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/GlobeArcs.mp4

      - name: Encode GlobeNight to MP4
        run: ffmpeg -i output/GlobeNight-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/GlobeNight.mp4

      - name: Encode GlobeHolo to MP4
        run: ffmpeg -i output/GlobeHolo-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/GlobeHolo.mp4

      - name: Encode GlobeOrbit to MP4
        run: ffmpeg -i output/GlobeOrbit-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/GlobeOrbit.mp4

      - name: Upload Globe
        uses: actions/upload-artifact@v4
        with:
          name: Globe
          path: output/Globe.mp4

      - name: Upload GlobeArcs
        uses: actions/upload-artifact@v4
        with:
          name: GlobeArcs
          path: output/GlobeArcs.mp4

      - name: Upload GlobeNight
        uses: actions/upload-artifact@v4
        with:
          name: GlobeNight
          path: output/GlobeNight.mp4

      - name: Upload GlobeHolo
        uses: actions/upload-artifact@v4
        with:
          name: GlobeHolo
          path: output/GlobeHolo.mp4

      - name: Upload GlobeOrbit
        uses: actions/upload-artifact@v4
        with:
          name: GlobeOrbit
          path: output/GlobeOrbit.mp4
