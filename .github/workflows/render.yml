name: Render HexSphere (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render HexSphere (ProRes)
        run: npx remotion render src/index.tsx HexSphere output/HexSphere-prores.mov --codec prores --prores-profile hq

      - name: Render HexTeal (ProRes)
        run: npx remotion render src/index.tsx HexTeal output/HexTeal-prores.mov --codec prores --prores-profile hq

      - name: Render HexViolet (ProRes)
        run: npx remotion render src/index.tsx HexViolet output/HexViolet-prores.mov --codec prores --prores-profile hq

      - name: Render HexAmber (ProRes)
        run: npx remotion render src/index.tsx HexAmber output/HexAmber-prores.mov --codec prores --prores-profile hq

      - name: Render HexRose (ProRes)
        run: npx remotion render src/index.tsx HexRose output/HexRose-prores.mov --codec prores --prores-profile hq

      - name: Encode HexSphere to MP4
        run: ffmpeg -i output/HexSphere-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/HexSphere.mp4

      - name: Encode HexTeal to MP4
        run: ffmpeg -i output/HexTeal-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/HexTeal.mp4

      - name: Encode HexViolet to MP4
        run: ffmpeg -i output/HexViolet-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/HexViolet.mp4

      - name: Encode HexAmber to MP4
        run: ffmpeg -i output/HexAmber-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/HexAmber.mp4

      - name: Encode HexRose to MP4
        run: ffmpeg -i output/HexRose-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/HexRose.mp4

      - name: Upload HexSphere
        uses: actions/upload-artifact@v4
        with:
          name: HexSphere
          path: output/HexSphere.mp4

      - name: Upload HexTeal
        uses: actions/upload-artifact@v4
        with:
          name: HexTeal
          path: output/HexTeal.mp4

      - name: Upload HexViolet
        uses: actions/upload-artifact@v4
        with:
          name: HexViolet
          path: output/HexViolet.mp4

      - name: Upload HexAmber
        uses: actions/upload-artifact@v4
        with:
          name: HexAmber
          path: output/HexAmber.mp4

      - name: Upload HexRose
        uses: actions/upload-artifact@v4
        with:
          name: HexRose
          path: output/HexRose.mp4
