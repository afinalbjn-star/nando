name: Render WaveFins (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render WaveFins (ProRes)
        run: npx remotion render src/index.tsx WaveFins output/WaveFins-prores.mov --codec prores --prores-profile hq

      - name: Render FinEmber (ProRes)
        run: npx remotion render src/index.tsx FinEmber output/FinEmber-prores.mov --codec prores --prores-profile hq

      - name: Render FinOcean (ProRes)
        run: npx remotion render src/index.tsx FinOcean output/FinOcean-prores.mov --codec prores --prores-profile hq

      - name: Render FinViolet (ProRes)
        run: npx remotion render src/index.tsx FinViolet output/FinViolet-prores.mov --codec prores --prores-profile hq

      - name: Render FinEmerald (ProRes)
        run: npx remotion render src/index.tsx FinEmerald output/FinEmerald-prores.mov --codec prores --prores-profile hq

      - name: Encode WaveFins to MP4 (~150MB)
        run: ffmpeg -i output/WaveFins-prores.mov -c:v libx264 -b:v 80M -maxrate 120M -bufsize 120M -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/WaveFins.mp4

      - name: Encode FinEmber to MP4 (~150MB)
        run: ffmpeg -i output/FinEmber-prores.mov -c:v libx264 -b:v 80M -maxrate 120M -bufsize 120M -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/FinEmber.mp4

      - name: Encode FinOcean to MP4 (~150MB)
        run: ffmpeg -i output/FinOcean-prores.mov -c:v libx264 -b:v 80M -maxrate 120M -bufsize 120M -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/FinOcean.mp4

      - name: Encode FinViolet to MP4 (~150MB)
        run: ffmpeg -i output/FinViolet-prores.mov -c:v libx264 -b:v 80M -maxrate 120M -bufsize 120M -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/FinViolet.mp4

      - name: Encode FinEmerald to MP4 (~150MB)
        run: ffmpeg -i output/FinEmerald-prores.mov -c:v libx264 -b:v 80M -maxrate 120M -bufsize 120M -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/FinEmerald.mp4

      - name: Check file sizes
        run: ls -la output/*.mp4 && du -h output/*.mp4

      - name: Upload WaveFins
        uses: actions/upload-artifact@v4
        with:
          name: WaveFins
          path: output/WaveFins.mp4

      - name: Upload FinEmber
        uses: actions/upload-artifact@v4
        with:
          name: FinEmber
          path: output/FinEmber.mp4

      - name: Upload FinOcean
        uses: actions/upload-artifact@v4
        with:
          name: FinOcean
          path: output/FinOcean.mp4

      - name: Upload FinViolet
        uses: actions/upload-artifact@v4
        with:
          name: FinViolet
          path: output/FinViolet.mp4

      - name: Upload FinEmerald
        uses: actions/upload-artifact@v4
        with:
          name: FinEmerald
          path: output/FinEmerald.mp4
