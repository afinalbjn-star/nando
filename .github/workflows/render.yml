name: Render Liquid Compositions (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render LiquidGold (ProRes)
        run: npx remotion render src/index.tsx LiquidGold output/LiquidGold-prores.mov --codec prores --prores-profile hq

      - name: Render LiquidSilver (ProRes)
        run: npx remotion render src/index.tsx LiquidSilver output/LiquidSilver-prores.mov --codec prores --prores-profile hq

      - name: Render LiquidCopper (ProRes)
        run: npx remotion render src/index.tsx LiquidCopper output/LiquidCopper-prores.mov --codec prores --prores-profile hq

      - name: Render LiquidOcean (ProRes)
        run: npx remotion render src/index.tsx LiquidOcean output/LiquidOcean-prores.mov --codec prores --prores-profile hq

      - name: Render LiquidRose (ProRes)
        run: npx remotion render src/index.tsx LiquidRose output/LiquidRose-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode LiquidGold to MP4
        run: ffmpeg -y -i output/LiquidGold-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/LiquidGold.mp4

      - name: Encode LiquidSilver to MP4
        run: ffmpeg -y -i output/LiquidSilver-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/LiquidSilver.mp4

      - name: Encode LiquidCopper to MP4
        run: ffmpeg -y -i output/LiquidCopper-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/LiquidCopper.mp4

      - name: Encode LiquidOcean to MP4
        run: ffmpeg -y -i output/LiquidOcean-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/LiquidOcean.mp4

      - name: Encode LiquidRose to MP4
        run: ffmpeg -y -i output/LiquidRose-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/LiquidRose.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload LiquidGold
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGold-4K
          path: output/LiquidGold.mp4

      - name: Upload LiquidSilver
        uses: actions/upload-artifact@v4
        with:
          name: LiquidSilver-4K
          path: output/LiquidSilver.mp4

      - name: Upload LiquidCopper
        uses: actions/upload-artifact@v4
        with:
          name: LiquidCopper-4K
          path: output/LiquidCopper.mp4

      - name: Upload LiquidOcean
        uses: actions/upload-artifact@v4
        with:
          name: LiquidOcean-4K
          path: output/LiquidOcean.mp4

      - name: Upload LiquidRose
        uses: actions/upload-artifact@v4
        with:
          name: LiquidRose-4K
          path: output/LiquidRose.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: Liquid-ProRes
          path: |
            output/LiquidGold-prores.mov
            output/LiquidSilver-prores.mov
            output/LiquidCopper-prores.mov
            output/LiquidOcean-prores.mov
            output/LiquidRose-prores.mov
