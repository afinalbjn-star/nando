name: Render Lens Compositions (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render BlueLens (ProRes)
        run: npx remotion render src/index.tsx BlueLens output/BlueLens-prores.mov --codec prores --prores-profile hq

      - name: Render EmeraldLens (ProRes)
        run: npx remotion render src/index.tsx EmeraldLens output/EmeraldLens-prores.mov --codec prores --prores-profile hq

      - name: Render VioletLens (ProRes)
        run: npx remotion render src/index.tsx VioletLens output/VioletLens-prores.mov --codec prores --prores-profile hq

      - name: Render SolarLens (ProRes)
        run: npx remotion render src/index.tsx SolarLens output/SolarLens-prores.mov --codec prores --prores-profile hq

      - name: Render RoseLens (ProRes)
        run: npx remotion render src/index.tsx RoseLens output/RoseLens-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode BlueLens to MP4
        run: ffmpeg -y -i output/BlueLens-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/BlueLens.mp4

      - name: Encode EmeraldLens to MP4
        run: ffmpeg -y -i output/EmeraldLens-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/EmeraldLens.mp4

      - name: Encode VioletLens to MP4
        run: ffmpeg -y -i output/VioletLens-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/VioletLens.mp4

      - name: Encode SolarLens to MP4
        run: ffmpeg -y -i output/SolarLens-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/SolarLens.mp4

      - name: Encode RoseLens to MP4
        run: ffmpeg -y -i output/RoseLens-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/RoseLens.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload BlueLens
        uses: actions/upload-artifact@v4
        with:
          name: BlueLens-4K
          path: output/BlueLens.mp4

      - name: Upload EmeraldLens
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldLens-4K
          path: output/EmeraldLens.mp4

      - name: Upload VioletLens
        uses: actions/upload-artifact@v4
        with:
          name: VioletLens-4K
          path: output/VioletLens.mp4

      - name: Upload SolarLens
        uses: actions/upload-artifact@v4
        with:
          name: SolarLens-4K
          path: output/SolarLens.mp4

      - name: Upload RoseLens
        uses: actions/upload-artifact@v4
        with:
          name: RoseLens-4K
          path: output/RoseLens.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: Lens-ProRes
          path: |
            output/BlueLens-prores.mov
            output/EmeraldLens-prores.mov
            output/VioletLens-prores.mov
            output/SolarLens-prores.mov
            output/RoseLens-prores.mov
