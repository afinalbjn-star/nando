name: Render Disco Compositions (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render DiscoPixel (ProRes)
        run: npx remotion render src/index.tsx DiscoPixel output/DiscoPixel-prores.mov --codec prores --prores-profile hq

      - name: Render DiscoOcean (ProRes)
        run: npx remotion render src/index.tsx DiscoOcean output/DiscoOcean-prores.mov --codec prores --prores-profile hq

      - name: Render DiscoCrimson (ProRes)
        run: npx remotion render src/index.tsx DiscoCrimson output/DiscoCrimson-prores.mov --codec prores --prores-profile hq

      - name: Render DiscoEmerald (ProRes)
        run: npx remotion render src/index.tsx DiscoEmerald output/DiscoEmerald-prores.mov --codec prores --prores-profile hq

      - name: Render DiscoSunset (ProRes)
        run: npx remotion render src/index.tsx DiscoSunset output/DiscoSunset-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode DiscoPixel to MP4
        run: ffmpeg -y -i output/DiscoPixel-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/DiscoPixel.mp4

      - name: Encode DiscoOcean to MP4
        run: ffmpeg -y -i output/DiscoOcean-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/DiscoOcean.mp4

      - name: Encode DiscoCrimson to MP4
        run: ffmpeg -y -i output/DiscoCrimson-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/DiscoCrimson.mp4

      - name: Encode DiscoEmerald to MP4
        run: ffmpeg -y -i output/DiscoEmerald-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/DiscoEmerald.mp4

      - name: Encode DiscoSunset to MP4
        run: ffmpeg -y -i output/DiscoSunset-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/DiscoSunset.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload DiscoPixel
        uses: actions/upload-artifact@v4
        with:
          name: DiscoPixel-4K
          path: output/DiscoPixel.mp4

      - name: Upload DiscoOcean
        uses: actions/upload-artifact@v4
        with:
          name: DiscoOcean-4K
          path: output/DiscoOcean.mp4

      - name: Upload DiscoCrimson
        uses: actions/upload-artifact@v4
        with:
          name: DiscoCrimson-4K
          path: output/DiscoCrimson.mp4

      - name: Upload DiscoEmerald
        uses: actions/upload-artifact@v4
        with:
          name: DiscoEmerald-4K
          path: output/DiscoEmerald.mp4

      - name: Upload DiscoSunset
        uses: actions/upload-artifact@v4
        with:
          name: DiscoSunset-4K
          path: output/DiscoSunset.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: Disco-ProRes
          path: |
            output/DiscoPixel-prores.mov
            output/DiscoOcean-prores.mov
            output/DiscoCrimson-prores.mov
            output/DiscoEmerald-prores.mov
            output/DiscoSunset-prores.mov
