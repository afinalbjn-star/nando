name: Render PolyPlates (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render PolyPlates (ProRes)
        run: npx remotion render src/index.tsx PolyPlates output/PolyPlates-prores.mov --codec prores --prores-profile hq

      - name: Render PlateWarm (ProRes)
        run: npx remotion render src/index.tsx PlateWarm output/PlateWarm-prores.mov --codec prores --prores-profile hq

      - name: Render PlateCool (ProRes)
        run: npx remotion render src/index.tsx PlateCool output/PlateCool-prores.mov --codec prores --prores-profile hq

      - name: Render PlateRose (ProRes)
        run: npx remotion render src/index.tsx PlateRose output/PlateRose-prores.mov --codec prores --prores-profile hq

      - name: Render PlateSage (ProRes)
        run: npx remotion render src/index.tsx PlateSage output/PlateSage-prores.mov --codec prores --prores-profile hq

      - name: Encode PolyPlates to MP4
        run: ffmpeg -i output/PolyPlates-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/PolyPlates.mp4

      - name: Encode PlateWarm to MP4
        run: ffmpeg -i output/PlateWarm-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/PlateWarm.mp4

      - name: Encode PlateCool to MP4
        run: ffmpeg -i output/PlateCool-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/PlateCool.mp4

      - name: Encode PlateRose to MP4
        run: ffmpeg -i output/PlateRose-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/PlateRose.mp4

      - name: Encode PlateSage to MP4
        run: ffmpeg -i output/PlateSage-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/PlateSage.mp4

      - name: Upload PolyPlates
        uses: actions/upload-artifact@v4
        with:
          name: PolyPlates
          path: output/PolyPlates.mp4

      - name: Upload PlateWarm
        uses: actions/upload-artifact@v4
        with:
          name: PlateWarm
          path: output/PlateWarm.mp4

      - name: Upload PlateCool
        uses: actions/upload-artifact@v4
        with:
          name: PlateCool
          path: output/PlateCool.mp4

      - name: Upload PlateRose
        uses: actions/upload-artifact@v4
        with:
          name: PlateRose
          path: output/PlateRose.mp4

      - name: Upload PlateSage
        uses: actions/upload-artifact@v4
        with:
          name: PlateSage
          path: output/PlateSage.mp4
