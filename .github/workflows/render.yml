name: Render

# Manual trigger only. Never add a `push:` trigger here: new compositions are
# previewed locally first and only rendered after the user asks for it.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        composition:
          - Globe
          - GlobeArcs
          - GlobeNight
          - GlobeHolo
          - GlobeOrbit
          - AmericaSignal
          - DigitalStage
          - CourierScooter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render intermediate (ProRes HQ)
        run: npx remotion render src/index.tsx ${{ matrix.composition }} "output/${{ matrix.composition }}-prores.mov" --codec prores --prores-profile hq

      - name: Encode MP4 (100-300 MB target)
        run: |
          set -euo pipefail
          IN="output/${{ matrix.composition }}-prores.mov"
          OUT="output/${{ matrix.composition }}.mp4"
          TARGET_MB=180
          MIN_MB=100
          MAX_MB=300
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$IN")
          BR=$(python3 -c "print(max(4000, int($TARGET_MB * 8 * 1000 / float('$DUR'))))")
          echo "duration=${DUR}s target=${TARGET_MB}MB initial bitrate=${BR}kbps"
          for attempt in 1 2 3; do
            ffmpeg -y -v error -i "$IN" -c:v libx264 -preset slow -b:v ${BR}k -pix_fmt yuv420p -pass 1 -passlogfile /tmp/plog -an -f null /dev/null
            ffmpeg -y -v error -i "$IN" -c:v libx264 -preset slow -b:v ${BR}k \
              -maxrate $((BR * 3 / 2))k -bufsize $((BR * 3))k \
              -pass 2 -passlogfile /tmp/plog -pix_fmt yuv420p -profile:v high -level 5.2 \
              -movflags +faststart -r 30 "$OUT"
            MB=$(( $(stat -c %s "$OUT") / 1024 / 1024 ))
            echo "attempt ${attempt}: ${MB} MB at ${BR} kbps"
            if [ "$MB" -ge "$MIN_MB" ] && [ "$MB" -le "$MAX_MB" ]; then
              echo "::notice::${{ matrix.composition }} -> ${MB} MB (${BR} kbps, ${DUR}s)"
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::${{ matrix.composition }} stuck at ${MB} MB, outside ${MIN_MB}-${MAX_MB} MB"
              exit 1
            fi
            BR=$(python3 -c "print(max(4000, int($BR * $TARGET_MB / max(1, $MB) * 1.04)))")
            echo "rescaling bitrate to ${BR} kbps"
          done

      - name: Upload ${{ matrix.composition }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.composition }}
          path: output/${{ matrix.composition }}.mp4
          if-no-files-found: error
