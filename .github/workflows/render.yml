name: Render

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        composition:
          - BokehRibbonGold
          - BokehRibbonCyan
          - BokehRibbonMagenta
          - BokehRibbonEmerald

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Render ProRes 4444 with alpha (stock deliverable)
        env:
          ID: ${{ matrix.composition }}
        # Remotion refuses transparency unless --image-format=png. Without both
        # flags it errors out; with them the alpha plane is real (verified locally
        # with alphaextract: min 0 / max 255).
        run: |
          npx remotion render src/index.tsx "$ID" "output/$ID-4444.mov" \
            --codec prores \
            --prores-profile 4444 \
            --image-format png \
            --pixel-format yuva444p10le \
            --concurrency 4 \
            --timeout 300000 \
            --log info

      - name: Verify deliverable (alpha, resolution, frame rate, loop seam)
        env:
          ID: ${{ matrix.composition }}
        run: |
          set -euo pipefail
          F="output/${ID}-4444.mov"
          ls -la "$F"

          echo "--- container/codec ---"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,profile,pix_fmt,width,height,r_frame_rate \
            -of default=nw=1 "$F" | tee /tmp/probe.txt

          grep -q 'codec_name=prores' /tmp/probe.txt || { echo "::error::not ProRes"; exit 1; }
          grep -q 'profile=4444'    /tmp/probe.txt || { echo "::error::not ProRes 4444"; exit 1; }
          grep -q 'pix_fmt=yuva'    /tmp/probe.txt || { echo "::error::no alpha pixel format"; exit 1; }
          grep -q 'width=3840'      /tmp/probe.txt || { echo "::error::not 4K wide"; exit 1; }
          grep -q 'height=2160'     /tmp/probe.txt || { echo "::error::not 2160 tall"; exit 1; }
          grep -q 'r_frame_rate=60' /tmp/probe.txt || { echo "::error::not 60fps"; exit 1; }

          # A 4444 file can still carry a fully opaque alpha plane. Prove the
          # matte is genuinely empty somewhere, or the deliverable is worthless.
          ffmpeg -y -v error -i "$F" -vf "alphaextract,format=gray" \
            -frames:v 1 -f rawvideo -pix_fmt gray /tmp/a.gray
          python3 - <<'PY'
          d = open('/tmp/a.gray','rb').read()
          mn, mx = min(d), max(d)
          transparent = sum(1 for v in d if v < 16) / len(d) * 100
          print(f"alpha plane: min={mn} max={mx} fully-transparent={transparent:.1f}%")
          assert mn < 250, f"alpha plane is opaque (min={mn})"
          assert transparent > 5, f"less than 5% of the frame is transparent ({transparent:.1f}%)"
          print("alpha OK")
          PY

          # Loop check: the 601st frame is the loop-point hold, so the wrap step
          # 599->600 must be no larger than a normal interior step 598->599.
          ffmpeg -y -v error -i "$F" -vf "select=eq(n\,598)" -frames:v 1 /tmp/f598.png
          ffmpeg -y -v error -i "$F" -vf "select=eq(n\,599)" -frames:v 1 /tmp/f599.png
          ffmpeg -y -v error -i "$F" -vf "select=eq(n\,600)" -frames:v 1 /tmp/f600.png
          python3 - <<'PY'
          import subprocess
          def gray(p):
              r = subprocess.run(['ffmpeg','-v','error','-i',p,'-vf','format=gray',
                                  '-f','rawvideo','-pix_fmt','gray','-'],
                                 capture_output=True)
              return r.stdout
          a, b, c = gray('/tmp/f598.png'), gray('/tmp/f599.png'), gray('/tmp/f600.png')
          def md(x, y):
              d = [abs(x[i]-y[i]) for i in range(min(len(x), len(y)))]
              return sum(d)/len(d)
          interior, wrap = md(a, b), md(b, c)
          print(f"loop seam: interior 598->599 = {interior:.4f}, wrap 599->600 = {wrap:.4f}")
          assert wrap <= interior * 1.25, (
              f"seam pops: wrap step {wrap:.4f} is much larger than an interior step {interior:.4f}")
          print("seam OK")
          PY

      - name: Render thumbnail and review preview
        env:
          ID: ${{ matrix.composition }}
        run: |
          set -euo pipefail
          # Portal thumbnail: frame 0 composited over dark so a transparent
          # deliverable still reads on a white admin page.
          ffmpeg -y -v error -i "output/${ID}-4444.mov" -frames:v 1 \
            -f lavfi -i "color=c=0x101018:s=3840x2160" \
            -filter_complex "[0][1]overlay" -frames:v 1 "output/${ID}-thumb.jpg"
          # Small H.264 preview for the marketplace listing / quick review.
          ffmpeg -y -v error -i "output/${ID}-4444.mov" \
            -vf "scale=1920:1080" -c:v libx264 -preset slow -crf 18 \
            -pix_fmt yuv420p -movflags +faststart -an "output/${ID}-preview.mp4"
          ls -la output/

      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.composition }}
          path: |
            output/${{ matrix.composition }}-4444.mov
            output/${{ matrix.composition }}-thumb.jpg
            output/${{ matrix.composition }}-preview.mp4
          if-no-files-found: error
          retention-days: 30