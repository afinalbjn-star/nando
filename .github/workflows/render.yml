name: Render Holo Compositions (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render HoloMarble (ProRes)
        run: npx remotion render src/index.tsx HoloMarble output/HoloMarble-prores.mov --codec prores --prores-profile hq

      - name: Render HoloAurora (ProRes)
        run: npx remotion render src/index.tsx HoloAurora output/HoloAurora-prores.mov --codec prores --prores-profile hq

      - name: Render HoloSunset (ProRes)
        run: npx remotion render src/index.tsx HoloSunset output/HoloSunset-prores.mov --codec prores --prores-profile hq

      - name: Render HoloOcean (ProRes)
        run: npx remotion render src/index.tsx HoloOcean output/HoloOcean-prores.mov --codec prores --prores-profile hq

      - name: Render HoloForest (ProRes)
        run: npx remotion render src/index.tsx HoloForest output/HoloForest-prores.mov --codec prores --prores-profile hq

      - name: Encode HoloMarble to MP4
        run: ffmpeg -i output/HoloMarble-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/HoloMarble.mp4

      - name: Encode HoloAurora to MP4
        run: ffmpeg -i output/HoloAurora-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/HoloAurora.mp4

      - name: Encode HoloSunset to MP4
        run: ffmpeg -i output/HoloSunset-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/HoloSunset.mp4

      - name: Encode HoloOcean to MP4
        run: ffmpeg -i output/HoloOcean-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/HoloOcean.mp4

      - name: Encode HoloForest to MP4
        run: ffmpeg -i output/HoloForest-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/HoloForest.mp4

      - name: Upload HoloMarble
        uses: actions/upload-artifact@v4
        with:
          name: HoloMarble
          path: output/HoloMarble.mp4

      - name: Upload HoloAurora
        uses: actions/upload-artifact@v4
        with:
          name: HoloAurora
          path: output/HoloAurora.mp4

      - name: Upload HoloSunset
        uses: actions/upload-artifact@v4
        with:
          name: HoloSunset
          path: output/HoloSunset.mp4

      - name: Upload HoloOcean
        uses: actions/upload-artifact@v4
        with:
          name: HoloOcean
          path: output/HoloOcean.mp4

      - name: Upload HoloForest
        uses: actions/upload-artifact@v4
        with:
          name: HoloForest
          path: output/HoloForest.mp4
