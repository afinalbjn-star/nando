name: Render PastelCubes (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render PastelCubes (ProRes)
        run: npx remotion render src/index.tsx PastelCubes output/PastelCubes-prores.mov --codec prores --prores-profile hq

      - name: Render PastelSunset (ProRes)
        run: npx remotion render src/index.tsx PastelSunset output/PastelSunset-prores.mov --codec prores --prores-profile hq

      - name: Render PastelOcean (ProRes)
        run: npx remotion render src/index.tsx PastelOcean output/PastelOcean-prores.mov --codec prores --prores-profile hq

      - name: Render PastelCandy (ProRes)
        run: npx remotion render src/index.tsx PastelCandy output/PastelCandy-prores.mov --codec prores --prores-profile hq

      - name: Render PastelForest (ProRes)
        run: npx remotion render src/index.tsx PastelForest output/PastelForest-prores.mov --codec prores --prores-profile hq

      - name: Encode PastelCubes to MP4
        run: ffmpeg -i output/PastelCubes-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/PastelCubes.mp4

      - name: Encode PastelSunset to MP4
        run: ffmpeg -i output/PastelSunset-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/PastelSunset.mp4

      - name: Encode PastelOcean to MP4
        run: ffmpeg -i output/PastelOcean-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/PastelOcean.mp4

      - name: Encode PastelCandy to MP4
        run: ffmpeg -i output/PastelCandy-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/PastelCandy.mp4

      - name: Encode PastelForest to MP4
        run: ffmpeg -i output/PastelForest-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/PastelForest.mp4

      - name: Upload PastelCubes
        uses: actions/upload-artifact@v4
        with:
          name: PastelCubes
          path: output/PastelCubes.mp4

      - name: Upload PastelSunset
        uses: actions/upload-artifact@v4
        with:
          name: PastelSunset
          path: output/PastelSunset.mp4

      - name: Upload PastelOcean
        uses: actions/upload-artifact@v4
        with:
          name: PastelOcean
          path: output/PastelOcean.mp4

      - name: Upload PastelCandy
        uses: actions/upload-artifact@v4
        with:
          name: PastelCandy
          path: output/PastelCandy.mp4

      - name: Upload PastelForest
        uses: actions/upload-artifact@v4
        with:
          name: PastelForest
          path: output/PastelForest.mp4
