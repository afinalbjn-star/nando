name: Render AmericaSignal

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render AmericaSignal (ProRes)
        run: npx remotion render src/index.tsx AmericaSignal output/AmericaSignal-prores.mov --codec prores --prores-profile hq

      - name: Encode AmericaSignal to MP4
        run: ffmpeg -i output/AmericaSignal-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/AmericaSignal.mp4

      - name: Upload AmericaSignal
        uses: actions/upload-artifact@v4
        with:
          name: AmericaSignal
          path: output/AmericaSignal.mp4
