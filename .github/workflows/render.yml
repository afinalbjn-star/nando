name: Render NeonStrings (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render NeonStrings (ProRes)
        run: npx remotion render src/index.tsx NeonStrings output/NeonStrings-prores.mov --codec prores --prores-profile hq

      - name: Render NeonStringsCrimson (ProRes)
        run: npx remotion render src/index.tsx NeonStringsCrimson output/NeonStringsCrimson-prores.mov --codec prores --prores-profile hq

      - name: Render NeonStringsOcean (ProRes)
        run: npx remotion render src/index.tsx NeonStringsOcean output/NeonStringsOcean-prores.mov --codec prores --prores-profile hq

      - name: Render NeonStringsEmerald (ProRes)
        run: npx remotion render src/index.tsx NeonStringsEmerald output/NeonStringsEmerald-prores.mov --codec prores --prores-profile hq

      - name: Render NeonStringsSunset (ProRes)
        run: npx remotion render src/index.tsx NeonStringsSunset output/NeonStringsSunset-prores.mov --codec prores --prores-profile hq

      - name: Encode NeonStrings to MP4
        run: ffmpeg -i output/NeonStrings-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/NeonStrings.mp4

      - name: Encode NeonStringsCrimson to MP4
        run: ffmpeg -i output/NeonStringsCrimson-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/NeonStringsCrimson.mp4

      - name: Encode NeonStringsOcean to MP4
        run: ffmpeg -i output/NeonStringsOcean-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/NeonStringsOcean.mp4

      - name: Encode NeonStringsEmerald to MP4
        run: ffmpeg -i output/NeonStringsEmerald-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/NeonStringsEmerald.mp4

      - name: Encode NeonStringsSunset to MP4
        run: ffmpeg -i output/NeonStringsSunset-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/NeonStringsSunset.mp4

      - name: Upload NeonStrings
        uses: actions/upload-artifact@v4
        with:
          name: NeonStrings
          path: output/NeonStrings.mp4

      - name: Upload NeonStringsCrimson
        uses: actions/upload-artifact@v4
        with:
          name: NeonStringsCrimson
          path: output/NeonStringsCrimson.mp4

      - name: Upload NeonStringsOcean
        uses: actions/upload-artifact@v4
        with:
          name: NeonStringsOcean
          path: output/NeonStringsOcean.mp4

      - name: Upload NeonStringsEmerald
        uses: actions/upload-artifact@v4
        with:
          name: NeonStringsEmerald
          path: output/NeonStringsEmerald.mp4

      - name: Upload NeonStringsSunset
        uses: actions/upload-artifact@v4
        with:
          name: NeonStringsSunset
          path: output/NeonStringsSunset.mp4
