name: Render CandyCheck (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render CandyCheck (ProRes)
        run: npx remotion render src/index.tsx CandyCheck output/CandyCheck-prores.mov --codec prores --prores-profile hq --scale 0.5

      - name: Render CheckOcean (ProRes)
        run: npx remotion render src/index.tsx CheckOcean output/CheckOcean-prores.mov --codec prores --prores-profile hq --scale 0.5

      - name: Render CheckGrape (ProRes)
        run: npx remotion render src/index.tsx CheckGrape output/CheckGrape-prores.mov --codec prores --prores-profile hq --scale 0.5

      - name: Render CheckTangerine (ProRes)
        run: npx remotion render src/index.tsx CheckTangerine output/CheckTangerine-prores.mov --codec prores --prores-profile hq --scale 0.5

      - name: Render CheckMint (ProRes)
        run: npx remotion render src/index.tsx CheckMint output/CheckMint-prores.mov --codec prores --prores-profile hq --scale 0.5

      - name: Encode CandyCheck to MP4
        run: ffmpeg -i output/CandyCheck-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t,scale=3840:2160" output/CandyCheck.mp4

      - name: Encode CheckOcean to MP4
        run: ffmpeg -i output/CheckOcean-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t,scale=3840:2160" output/CheckOcean.mp4

      - name: Encode CheckGrape to MP4
        run: ffmpeg -i output/CheckGrape-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t,scale=3840:2160" output/CheckGrape.mp4

      - name: Encode CheckTangerine to MP4
        run: ffmpeg -i output/CheckTangerine-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t,scale=3840:2160" output/CheckTangerine.mp4

      - name: Encode CheckMint to MP4
        run: ffmpeg -i output/CheckMint-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t,scale=3840:2160" output/CheckMint.mp4

      - name: Upload CandyCheck
        uses: actions/upload-artifact@v4
        with:
          name: CandyCheck
          path: output/CandyCheck.mp4

      - name: Upload CheckOcean
        uses: actions/upload-artifact@v4
        with:
          name: CheckOcean
          path: output/CheckOcean.mp4

      - name: Upload CheckGrape
        uses: actions/upload-artifact@v4
        with:
          name: CheckGrape
          path: output/CheckGrape.mp4

      - name: Upload CheckTangerine
        uses: actions/upload-artifact@v4
        with:
          name: CheckTangerine
          path: output/CheckTangerine.mp4

      - name: Upload CheckMint
        uses: actions/upload-artifact@v4
        with:
          name: CheckMint
          path: output/CheckMint.mp4
