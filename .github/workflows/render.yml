name: Render Molten Compositions (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render MoltenGold (ProRes)
        run: npx remotion render src/index.tsx MoltenGold output/MoltenGold-prores.mov --codec prores --prores-profile hq

      - name: Render MoltenSilver (ProRes)
        run: npx remotion render src/index.tsx MoltenSilver output/MoltenSilver-prores.mov --codec prores --prores-profile hq

      - name: Render MoltenCopper (ProRes)
        run: npx remotion render src/index.tsx MoltenCopper output/MoltenCopper-prores.mov --codec prores --prores-profile hq

      - name: Render MoltenOcean (ProRes)
        run: npx remotion render src/index.tsx MoltenOcean output/MoltenOcean-prores.mov --codec prores --prores-profile hq

      - name: Render MoltenCrimson (ProRes)
        run: npx remotion render src/index.tsx MoltenCrimson output/MoltenCrimson-prores.mov --codec prores --prores-profile hq

      - name: Encode MoltenGold to MP4
        run: ffmpeg -i output/MoltenGold-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/MoltenGold.mp4

      - name: Encode MoltenSilver to MP4
        run: ffmpeg -i output/MoltenSilver-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/MoltenSilver.mp4

      - name: Encode MoltenCopper to MP4
        run: ffmpeg -i output/MoltenCopper-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/MoltenCopper.mp4

      - name: Encode MoltenOcean to MP4
        run: ffmpeg -i output/MoltenOcean-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/MoltenOcean.mp4

      - name: Encode MoltenCrimson to MP4
        run: ffmpeg -i output/MoltenCrimson-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p -vf "noise=alls=8:allf=t" output/MoltenCrimson.mp4

      - name: Upload MoltenGold
        uses: actions/upload-artifact@v4
        with:
          name: MoltenGold
          path: output/MoltenGold.mp4

      - name: Upload MoltenSilver
        uses: actions/upload-artifact@v4
        with:
          name: MoltenSilver
          path: output/MoltenSilver.mp4

      - name: Upload MoltenCopper
        uses: actions/upload-artifact@v4
        with:
          name: MoltenCopper
          path: output/MoltenCopper.mp4

      - name: Upload MoltenOcean
        uses: actions/upload-artifact@v4
        with:
          name: MoltenOcean
          path: output/MoltenOcean.mp4

      - name: Upload MoltenCrimson
        uses: actions/upload-artifact@v4
        with:
          name: MoltenCrimson
          path: output/MoltenCrimson.mp4
