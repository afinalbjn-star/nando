name: Render Cube Compositions (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render CubeField (ProRes)
        run: npx remotion render src/index.tsx CubeField output/CubeField-prores.mov --codec prores --prores-profile hq

      - name: Render CubeOcean (ProRes)
        run: npx remotion render src/index.tsx CubeOcean output/CubeOcean-prores.mov --codec prores --prores-profile hq

      - name: Render CubeCandy (ProRes)
        run: npx remotion render src/index.tsx CubeCandy output/CubeCandy-prores.mov --codec prores --prores-profile hq

      - name: Render CubeMint (ProRes)
        run: npx remotion render src/index.tsx CubeMint output/CubeMint-prores.mov --codec prores --prores-profile hq

      - name: Render CubeSunset (ProRes)
        run: npx remotion render src/index.tsx CubeSunset output/CubeSunset-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode CubeField to MP4
        run: ffmpeg -y -i output/CubeField-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/CubeField.mp4

      - name: Encode CubeOcean to MP4
        run: ffmpeg -y -i output/CubeOcean-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/CubeOcean.mp4

      - name: Encode CubeCandy to MP4
        run: ffmpeg -y -i output/CubeCandy-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/CubeCandy.mp4

      - name: Encode CubeMint to MP4
        run: ffmpeg -y -i output/CubeMint-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/CubeMint.mp4

      - name: Encode CubeSunset to MP4
        run: ffmpeg -y -i output/CubeSunset-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/CubeSunset.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload CubeField
        uses: actions/upload-artifact@v4
        with:
          name: CubeField-4K
          path: output/CubeField.mp4

      - name: Upload CubeOcean
        uses: actions/upload-artifact@v4
        with:
          name: CubeOcean-4K
          path: output/CubeOcean.mp4

      - name: Upload CubeCandy
        uses: actions/upload-artifact@v4
        with:
          name: CubeCandy-4K
          path: output/CubeCandy.mp4

      - name: Upload CubeMint
        uses: actions/upload-artifact@v4
        with:
          name: CubeMint-4K
          path: output/CubeMint.mp4

      - name: Upload CubeSunset
        uses: actions/upload-artifact@v4
        with:
          name: CubeSunset-4K
          path: output/CubeSunset.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: Cube-ProRes
          path: |
            output/CubeField-prores.mov
            output/CubeOcean-prores.mov
            output/CubeCandy-prores.mov
            output/CubeMint-prores.mov
            output/CubeSunset-prores.mov
