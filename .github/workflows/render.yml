name: Render HexWave Compositions (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render GoldHexWave (ProRes)
        run: npx remotion render src/index.tsx GoldHexWave output/GoldHexWave-prores.mov --codec prores --prores-profile hq

      - name: Render CrimsonHexWave (ProRes)
        run: npx remotion render src/index.tsx CrimsonHexWave output/CrimsonHexWave-prores.mov --codec prores --prores-profile hq

      - name: Render EmeraldHexWave (ProRes)
        run: npx remotion render src/index.tsx EmeraldHexWave output/EmeraldHexWave-prores.mov --codec prores --prores-profile hq

      - name: Render VioletHexWave (ProRes)
        run: npx remotion render src/index.tsx VioletHexWave output/VioletHexWave-prores.mov --codec prores --prores-profile hq

      - name: Render OceanHexWave (ProRes)
        run: npx remotion render src/index.tsx OceanHexWave output/OceanHexWave-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode GoldHexWave to MP4
        run: ffmpeg -y -i output/GoldHexWave-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/GoldHexWave.mp4

      - name: Encode CrimsonHexWave to MP4
        run: ffmpeg -y -i output/CrimsonHexWave-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/CrimsonHexWave.mp4

      - name: Encode EmeraldHexWave to MP4
        run: ffmpeg -y -i output/EmeraldHexWave-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/EmeraldHexWave.mp4

      - name: Encode VioletHexWave to MP4
        run: ffmpeg -y -i output/VioletHexWave-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/VioletHexWave.mp4

      - name: Encode OceanHexWave to MP4
        run: ffmpeg -y -i output/OceanHexWave-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/OceanHexWave.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload GoldHexWave
        uses: actions/upload-artifact@v4
        with:
          name: GoldHexWave-4K
          path: output/GoldHexWave.mp4

      - name: Upload CrimsonHexWave
        uses: actions/upload-artifact@v4
        with:
          name: CrimsonHexWave-4K
          path: output/CrimsonHexWave.mp4

      - name: Upload EmeraldHexWave
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldHexWave-4K
          path: output/EmeraldHexWave.mp4

      - name: Upload VioletHexWave
        uses: actions/upload-artifact@v4
        with:
          name: VioletHexWave-4K
          path: output/VioletHexWave.mp4

      - name: Upload OceanHexWave
        uses: actions/upload-artifact@v4
        with:
          name: OceanHexWave-4K
          path: output/OceanHexWave.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: HexWave-ProRes
          path: |
            output/GoldHexWave-prores.mov
            output/CrimsonHexWave-prores.mov
            output/EmeraldHexWave-prores.mov
            output/VioletHexWave-prores.mov
            output/OceanHexWave-prores.mov
