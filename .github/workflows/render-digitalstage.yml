name: Render DigitalStage

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/components/DigitalStage.tsx'
      - '.github/workflows/render-digitalstage.yml'

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render DigitalStage (ProRes)
        run: npx remotion render src/index.tsx DigitalStage output/DigitalStage-prores.mov --codec prores --prores-profile hq

      - name: Encode DigitalStage to MP4
        run: ffmpeg -i output/DigitalStage-prores.mov -c:v libx264 -crf 18 -pix_fmt yuv420p output/DigitalStage.mp4

      - name: Upload DigitalStage (MP4)
        uses: actions/upload-artifact@v4
        with:
          name: DigitalStage
          path: output/DigitalStage.mp4

      - name: Upload DigitalStage (ProRes)
        uses: actions/upload-artifact@v4
        with:
          name: DigitalStage-prores
          path: output/DigitalStage-prores.mov
